<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Wind forecast accuracy analysis for Great Britain national generation."
    />
    <title>Wind Forecast Intelligence</title>
    <script>
      // Unregister any stale service workers from other projects on localhost:5173
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
          }
        });
      }
      // Redirect stale subpaths like /admin back to root
      if (window.location.pathname !== '/' && !window.location.pathname.startsWith('/api')) {
        window.history.replaceState(null, '', '/');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
